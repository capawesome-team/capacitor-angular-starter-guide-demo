<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/trips"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEdit() ? 'Edit Trip' : 'New Trip' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="save()"
        [disabled]="form.invalid || saving()"
        [strong]="true"
      >
        @if (saving()) {
        <ion-spinner name="crescent" class="save-spinner"></ion-spinner>
        } @else { Save }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-loading
    [isOpen]="saving()"
    message="Saving trip..."
    spinner="crescent"
    [backdropDismiss]="false"
  >
  </ion-loading>

  <form [formGroup]="form" (ngSubmit)="save()">
    <ion-list lines="full" class="form-list">
      <ion-item>
        <ion-input
          formControlName="name"
          label="Trip Name"
          labelPlacement="stacked"
          placeholder="e.g., Summer in Italy"
          [clearInput]="true"
          maxlength="100"
        >
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-textarea
          formControlName="description"
          label="Description"
          labelPlacement="stacked"
          placeholder="Optional trip description"
          [autoGrow]="true"
          [rows]="2"
        >
        </ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label>Start date</ion-label>
        <ion-datetime-button
          slot="end"
          datetime="trip-start-date"
        ></ion-datetime-button>
      </ion-item>

      <ion-item>
        <ion-label>End date</ion-label>
        <ion-datetime-button
          slot="end"
          datetime="trip-end-date"
        ></ion-datetime-button>
      </ion-item>

      <ion-item>
        <ion-select
          formControlName="currency"
          label="Currency"
          labelPlacement="stacked"
          interface="action-sheet"
        >
          @for (c of currencies; track c.code) {
          <ion-select-option [value]="c.code"
            >{{ c.symbol }} {{ c.name }}</ion-select-option
          >
          }
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input
          formControlName="budget"
          label="Budget (optional)"
          labelPlacement="stacked"
          type="number"
          placeholder="0.00"
          [min]="0"
        >
        </ion-input>
      </ion-item>
    </ion-list>

    <div class="trip-form__cover">
      <h4>Cover image</h4>

      @if (coverImage(); as cover) {
      <div class="trip-form__cover-preview">
        <img [src]="cover.uri" alt="Trip cover preview" />
        <div class="trip-form__cover-actions">
          <ion-button fill="outline" size="small" (click)="attachCoverImage()">
            <ion-icon slot="start" name="image-outline"></ion-icon>
            Change image
          </ion-button>
          <ion-chip (click)="removeCoverImage()">
            <ion-icon name="close-circle"></ion-icon>
            <ion-label>Remove image</ion-label>
          </ion-chip>
        </div>
      </div>
      } @else {
      <ion-button expand="block" fill="outline" (click)="attachCoverImage()">
        <ion-icon slot="start" name="image-outline"></ion-icon>
        Add cover image
      </ion-button>
      }
    </div>

    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          id="trip-start-date"
          formControlName="startDate"
          presentation="date"
          [showDefaultButtons]="true"
          (ionChange)="onStartDateChange()"
        ></ion-datetime>
      </ng-template>
    </ion-modal>

    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          id="trip-end-date"
          formControlName="endDate"
          presentation="date"
          [min]="form.value.startDate || undefined"
          [showDefaultButtons]="true"
        ></ion-datetime>
      </ng-template>
    </ion-modal>
  </form>
</ion-content>
